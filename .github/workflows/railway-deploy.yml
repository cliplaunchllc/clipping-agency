name: Deploy to Railway

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: curl -fsSL https://railway.com/install.sh | sh

      - name: Deploy
        run: $HOME/.railway/bin/railway up --detach --service 839f4797-4912-4cea-bf70-70fc08743608 --project 78e90682-89f6-4e06-bf43-ad3989136220
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
